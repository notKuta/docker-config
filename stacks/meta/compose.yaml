services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    labels:
      caddy: http://uptime.janosik.lan
      caddy.reverse_proxy: uptime-kuma:3001
    networks:
      - proxy-net
    volumes:
      - ../../apps/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    labels:
      caddy: http://home.janosik.lan
      caddy.reverse_proxy: homepage:3000
    networks:
      - proxy-net
    volumes:
      - ../../apps/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.janosik.lan # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    restart: unless-stopped
  
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    labels:
      caddy: http://beszel.janosik.lan
      caddy.reverse_proxy: beszel:8090
    networks:
      - proxy-net
    environment:
      APP_URL: http://beszel.janosik.lan
    volumes:
      - ../../apps/beszel/data:/beszel_data
      - ../../apps/beszel/beszel_socket:/beszel_socket
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    volumes:
      - ../../apps/beszel/agent_data:/var/lib/beszel-agent
      - ../../apps/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Needed for additional disk I/O monitoring
      - /mnt/hdd/.beszel:/extra-filesystems/sda1__Media:ro
    env_file: ../../apps/beszel/.env
    #healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
    restart: unless-stopped

networks:
  proxy-net:
    external: true
